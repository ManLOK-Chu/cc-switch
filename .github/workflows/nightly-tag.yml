name: Nightly Tag

on:
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 = 北京时间 06:00
  workflow_dispatch:       # 允许手动触发

permissions:
  contents: write

concurrency:
  group: nightly-tag
  cancel-in-progress: true

jobs:
  tag-if-new:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Check for new commits since last nightly
        id: check
        shell: bash
        run: |
          # 使用北京时间 (UTC+8) 计算日期，确保 tag 与用户感知的日期一致
          TAG="nightly-$(TZ='Asia/Shanghai' date +%Y%m%d)"

          # 检查目标 tag 是否已存在
          if git tag --list "$TAG" | grep -q .; then
            echo "Tag $TAG already exists, skipping"
            echo "create=false" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 查找最新的 nightly tag
          LAST_NIGHTLY=$(git tag --list 'nightly-*' --sort=-creatordate | head -1)

          if [ -z "$LAST_NIGHTLY" ]; then
            echo "No previous nightly tag found, creating first one: $TAG"
            echo "create=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 检查 last nightly tag 之后是否有新提交
          NEW_COMMITS=$(git rev-list --count "${LAST_NIGHTLY}..HEAD" 2>/dev/null || echo 0)
          echo "Commits since $LAST_NIGHTLY: $NEW_COMMITS"

          if [ "$NEW_COMMITS" -gt 0 ]; then
            echo "New commits found, creating tag: $TAG"
            echo "create=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new commits since $LAST_NIGHTLY, skipping"
            echo "create=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify origin is the fork (not farion1231 upstream)
        if: steps.check.outputs.create == 'true'
        shell: bash
        run: |
          ORIGIN_URL=$(git remote get-url origin)
          if echo "$ORIGIN_URL" | grep -qi "farion1231"; then
            echo "::error::Refusing to push nightly tag: origin points to farion1231 upstream"
            echo "::error::  ORIGIN_URL=$ORIGIN_URL"
            echo "::error::  nightly-* tags are fork-specific and would pollute the upstream repo's tag list."
            echo "::error::  Fix: git remote set-url origin https://github.com/ManLOK-Chu/cc-switch.git"
            exit 1
          fi
          echo "✅ origin is the fork: $ORIGIN_URL"

      - name: Create and push tag
        if: steps.check.outputs.create == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag "${{ steps.check.outputs.tag }}"
          git push origin "${{ steps.check.outputs.tag }}"

      - name: Trigger Release workflow
        if: steps.check.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/dispatches \
            --method POST \
            --field event_type=nightly-release \
            --field client_payload[tag]="${{ steps.check.outputs.tag }}" \
            --field client_payload[sha]="${{ github.sha }}"
          echo "✅ Dispatched nightly-release for tag ${{ steps.check.outputs.tag }}"
